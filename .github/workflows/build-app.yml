name: Build SGT Boost

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: SGT Boost ${{ github.ref_name }}
          body: "Stupidly good results. No questions asked.\n\n(Fictional ARG prop app: offline, doesn't touch your files, closes like a normal app.)"
          files: |
            desktop/dist/SGT-Boost-linux.AppImage
            desktop/dist/SGT-Boost-windows-setup.exe
            desktop/dist/SGT-Boost-mac.dmg
