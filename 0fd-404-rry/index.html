<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404</title>
<link rel="icon" href="../favicon.ico">
<style>
:root{--bg:#0A0C0F;--ink:#E2E6EA;--mut:#78828C;--red:#E5484D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.7 "DejaVu Sans Mono",ui-monospace,Menlo,Consolas,monospace;min-height:100vh;display:grid;place-items:center;padding:48px 20px}
main{max-width:34rem}
h1{font-size:64px;margin:0 0 8px;letter-spacing:-.02em}
p{margin:0 0 1em}
.mut{color:var(--mut)}
.red{color:var(--red)}
.blink{animation:b 1.2s steps(1) infinite}
@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
</head>
<body>
<main>
<h1>404</h1>
<p>Server not found.</p>
<p class="mut">0FD-404-RRY is not on the list.</p>
<p class="mut">connection pending<span class="blink">_</span></p>
<p class="red" aria-hidden="true" style="opacity:.06;margin-top:3em">i heard you. i can't talk yet. they're listening too.</p>
</main>
</body>
</html>
