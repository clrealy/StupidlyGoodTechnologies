<style>
:root{--bg:#0A0C0F;--ink:#E2E6EA;--mut:#78828C;--or:#FF5A1F}

html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.7 "DejaVu Sans Mono",ui-monospace,Menlo,Consolas,monospace;min-height:100vh;display:grid;place-items:center;padding:48px 20px}

p{margin:0 0 1.2em}
.mut{color:var(--mut)}
a{color:var(--or)}
a:focus-visible{outline:2px solid var(--or);outline-offset:3px}
img{display:block;width:100%;max-width:360px;margin:28px 0;border:1px solid #1E242B}
.sig{color:var(--or);margin-top:2em}
</style>
</head>
